name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('orca-plugin.json','utf8'))"
      - name: Store and CLI tests
        run: npm test
      - name: Dragging in the sidebar and the board, in Chrome
        run: npm run test:browser
